# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=9090


# ============================================
# SPRING APPLICATION
# ============================================
spring.application.name=ecommerce-api


# ============================================
# DATASOURCE (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=shaik123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ============================================
# JWT CONFIGURATION (custom app properties)
# ============================================
app.jwt.secret=9a4f2c8d3b7a1e6f5c0d8b2a4e6f8a1c3d5b7e9f0a2c4e6f8a1b3d5c7e9f0a2c
app.jwt.expiration-ms=86400000


# ============================================
# SPRINGDOC / SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.security=INFO
logging.level.com.example.ecommerce=DEBUG